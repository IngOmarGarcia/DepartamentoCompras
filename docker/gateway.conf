# Replica el enrutamiento de Supabase: supabase-js llama a <URL>/rest/v1/...
# mientras que PostgREST sirve en la raíz.
server {
    listen 80;
    server_name _;

    location /rest/v1/ {
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://rest:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"servicio":"gateway-local"}';
    }
}
